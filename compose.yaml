services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://housememory:${POSTGRES_PASSWORD:?}@database:5432/housememory
      APP_PASSWORD: ${APP_PASSWORD:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DATA_DIR: /app/data
      PLANS_DIR: /app/plans
    expose:
      - "3000"
    volumes:
      - panorama_data:/app/data
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: housememory
      POSTGRES_USER: housememory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housememory -d housememory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  panorama_data:
  postgres_data:

